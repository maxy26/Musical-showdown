name: Recuperar llave (BORRAR DESPUÉS)
on: workflow_dispatch      # solo lo puede lanzar alguien con permiso de escritura
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruir y cifrar (nada sensible se imprime en el registro)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RECOVERY_PASS: ${{ secrets.RECOVERY_PASS }}
        run: |
          set -euo pipefail
          test -n "$RECOVERY_PASS" || { echo "Falta el secreto RECOVERY_PASS"; exit 1; }
          mkdir recuperado
          guardar(){ # $1 = nombre del archivo, $2 = valor del secreto. Detecta si viene en base64.
            if [ -z "$2" ]; then echo "$1: el secreto está vacío"; return; fi
            if printf '%s' "$2" | tr -d ' \r\n' | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
              printf '%s' "$2" | base64 -d -i > "recuperado/$1"; echo "$1: venía en base64 (decodificado)"
            else
              printf '%s' "$2" > "recuperado/$1"; echo "$1: venía como texto"
            fi
          }
          guardar llave.jks                       "$KEYSTORE_B64"
          guardar key.properties                  "$KEY_PROPS"
          guardar firebase-service-account.json   "$FIREBASE_SA"
          guardar google-services.json            "$GOOGLE_SERVICES"
          test -s recuperado/llave.jks || { echo "La llave salió vacía"; exit 1; }
          echo "SHA-256 de la llave: $(sha256sum recuperado/llave.jks | cut -d' ' -f1)"
          tar czf - recuperado | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:RECOVERY_PASS -out llave.tar.gz.enc
          rm -rf recuperado
      - uses: actions/upload-artifact@v4
        with:
          name: llave-cifrada
          path: llave.tar.gz.enc
          retention-days: 1
