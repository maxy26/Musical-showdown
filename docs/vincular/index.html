<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musical Showdown · Vincular</title>
<meta name="robots" content="noindex">
<!--
  Página del QR de "📱 Vincular" (12-10-2026; ver src/js/vinculo.js).
  Si la app está instalada, Android la abre directo y esta página no se ve.
  Si no (o si el enlace se abrió en el navegador), ofrece abrir la app con
  el mismo código o descargarla. Se publica con GitHub Pages (carpeta docs/).
-->
<link rel="icon" href="../icono.png">
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(../fonts/inter.woff2) format('woff2');}
  :root{--fondo:#ffffff;--texto:#1b1f2e;--suave:#5f667a;--linea:#e5e8f0;--acento:#3346c8;color-scheme:light;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--fondo);color:var(--texto);
    font:16px/1.7 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .hero{background:#141833;color:#fff;padding:40px 20px 44px;text-align:center;}
  .hero img{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 14px;}
  .hero .marca{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#9fb0ff;margin:0;}
  .hero h1{font-size:clamp(26px,6vw,34px);line-height:1.15;letter-spacing:-.02em;font-weight:700;margin:6px 0 0;}
  main{flex:1;width:100%;max-width:420px;margin:0 auto;padding:30px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;}
  p{margin:0;}
  a.boton{display:block;padding:15px;border-radius:12px;font-weight:650;font-size:17px;text-decoration:none;}
  .principal{background:var(--acento);color:#fff;}
  .secundario{border:1px solid var(--linea);color:var(--acento);}
  .nota{font-size:14px;color:var(--suave);}
  footer{color:var(--suave);font-size:14px;text-align:center;padding:22px 20px 32px;border-top:1px solid var(--linea);}
  footer a{color:var(--acento);}
</style>
</head>
<body>
<header class="hero">
  <img src="../icono.png" alt="">
  <p class="marca">Vincular</p>
  <h1>Musical Showdown</h1>
</header>
<main>
  <p>Este código vincula tu celular con la partida que se ve en la PC.</p>
  <a class="boton principal" id="abrir" href="#">Abrir en la app</a>
  <a class="boton secundario" id="descargar" href="https://github.com/maxy26/Musical-showdown/releases/latest">¿No la tienes? Descárgala</a>
  <p class="nota">Después de instalarla, vuelve a escanear el código de la PC.</p>
</main>
<footer><a href="../privacidad/">Privacidad y términos</a></footer>
<script>
  // Dónde se descarga el juego. Es lo único que hay que cambiar al publicar en tiendas:
  // DESCARGA_ANDROID para celulares Android y DESCARGA_OTROS para PC y demás.
  // Al salir en Google Play, poner:
  //   https://play.google.com/store/apps/details?id=com.musicalshowdown.app
  var DESCARGA_ANDROID = "https://github.com/maxy26/Musical-showdown/releases/latest";
  var DESCARGA_OTROS = "https://github.com/maxy26/Musical-showdown/releases/latest";

  var esAndroid = /android/i.test(navigator.userAgent);
  var descarga = esAndroid ? DESCARGA_ANDROID : DESCARGA_OTROS;
  // Abre la app con el mismo enlace (y el código); si no está instalada, va a la descarga.
  var destino = location.host + location.pathname + location.search;
  var intento = "intent://" + destino + "#Intent;scheme=https;package=com.musicalshowdown.app;S.browser_fallback_url=" +
    encodeURIComponent(descarga) + ";end";
  document.getElementById("abrir").href = esAndroid ? intento : descarga;
  document.getElementById("descargar").href = descarga;
</script>
</body>
</html>
